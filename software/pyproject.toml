[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controller-app"
version = "0.1.0"
description = "GUI controller for STM32 stepper motor board"
requires-python = ">=3.11"
authors = [{ name = "StepperControl team" }]
dependencies = [
    "PyQt6>=6.7",
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
controller-app = "controller_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]