# Единый источник правды по протоколу обмена.
# Из этого файла генерируются:
#   - firmware/src/middleware/protocol/inc/protocol_gen.h
#   - software/src/controller_app/protocol/messages.py

version: 1
endianness: little

constants:
  SOF: 0xA5
  CRC_INIT: 0xFFFF

commands:
  - name: PING
    code: 0x01
    request:  []
    response: [{name: ms, type: u32}]

  - name: GET_VERSION
    code: 0x02
    request:  []
    response:
      - {name: major, type: u8}
      - {name: minor, type: u8}
      - {name: patch, type: u8}
      - {name: build, type: u32}

  - name: MOTOR_MOVE
    code: 0x10
    request:
      - {name: steps,    type: i32}
      - {name: speed,    type: u32}
      - {name: accel,    type: u32}
    response: []

  - name: MOTOR_STOP
    code: 0x11
    request:  []
    response: []

  - name: TELEMETRY_STREAM
    code: 0x20
    direction: device_to_host
    payload:
      - {name: ts_ms,    type: u32}
      - {name: position, type: i32}
      - {name: current,  type: u16}
      - {name: temp_c10, type: i16}